[package]
name = "kuroshio-net"
description = "黑潮 DNS：網路層（上游傳輸、TLS、DoT / DoH、bootstrap、下載、IP 測速）"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true

[dependencies]
kuroshio-config = { path = "../kuroshio-config" }
kuroshio-proto = { path = "../kuroshio-proto" }
anyhow.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
webpki-roots = "1"
h2 = "0.4"
http = "1"
bytes = "1"
quinn = { version = "0.11", default-features = false, features = ["rustls-ring", "runtime-tokio"] }
h3 = "0.0.8"
h3-quinn = "0.0.10"
