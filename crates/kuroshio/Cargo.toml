[package]
name = "kuroshio"
description = "黑潮 DNS（Kuroshio DNS）：把連線帶回台灣節點的 DNS 伺服器"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "kuroshio"
path = "src/main.rs"

[features]
acme = ["dep:instant-acme"]

[dependencies]
kuroshio-config = { path = "../kuroshio-config" }
kuroshio-proto = { path = "../kuroshio-proto" }
kuroshio-filter = { path = "../kuroshio-filter" }
kuroshio-net = { path = "../kuroshio-net" }
kuroshio-jobs = { path = "../kuroshio-jobs" }
kuroshio-cdn = { path = "../kuroshio-cdn" }
kuroshio-community = { path = "../kuroshio-community" }
anyhow.workspace = true
serde_json.workspace = true
tokio.workspace = true
clap.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
socket2 = "0.6"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
hyper = { version = "1", features = ["server", "http1", "http2"] }
hyper-util = { version = "0.1", features = ["server-auto", "tokio"] }
http-body-util = "0.1"
bytes = "1"
quinn = { version = "0.11", default-features = false, features = ["rustls-ring", "runtime-tokio"] }
h3 = "0.0.8"
h3-quinn = "0.0.10"
http = "1"
x509-parser = { version = "0.16", default-features = false }
# 關於頁、公開頁的 QR 碼（只用 SVG 輸出）
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
# 內建 ACME（Windows 版；OpenWrt 用 acme.sh，不編進來以縮小執行檔）
instant-acme = { version = "0.8", default-features = false, features = ["ring", "hyper-rustls", "rcgen"], optional = true }
# 描述檔的固定 UUID（SHA-1）；rustls 已經用到 ring，不會多編一份
ring = "0.17"
# 備份檔（.kuroshio）：zstd 壓縮的 JSON，二進位檔用 base64
zstd = { version = "0.13", default-features = false }
base64 = "0.22"

[target.'cfg(windows)'.dependencies]
windows-service = "0.8"
# PEM 憑證轉成 PFX 匯入 Windows 憑證存放區（IIS 用）；純 Rust、很小，只有 Windows 版會編進去
p12 = "0.6.3"

[dev-dependencies]
p12 = "0.6.3"
rcgen = "0.13"
h2 = "0.4"
