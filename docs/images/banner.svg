  </linearGradient>
  <radialGradient id="glow" cx="1102" cy="160" r="300" gradientUnits="userSpaceOnUse">
    <stop offset="0" stop-color="#3fb6ff" stop-opacity=".38"/><stop offset="1" stop-color="#3fb6ff" stop-opacity="0"/>
  </radialGradient>
  <linearGradient id="cur" x1="0" y1="0" x2="1280" y2="0" gradientUnits="userSpaceOnUse">
    <stop offset="0" stop-color="#2a7fc0" stop-opacity="0"/><stop offset=".35" stop-color="#3aa2e0" stop-opacity=".5"/>
    <stop offset=".8" stop-color="#7fdcff"/><stop offset="1" stop-color="#bff0ff"/>
  </linearGradient>
  <linearGradient id="land" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#e9f8ff"/><stop offset="1" stop-color="#b9e6fb"/>
  </linearGradient>
</defs>
