<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow, noarchive, nosnippet">
<meta name="referrer" content="no-referrer">
<meta name="color-scheme" content="dark light">
<title>黑潮 DNS · 詳細數據</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/assets/dashboard.css">
<style>
:root {
  color-scheme: dark;
  /* 黑潮：深靛藍的海、青綠到青藍的洋流（跟公開頁同一套顏色） */
  --bg: #040b1a; --bg-2: #0b1d40; --text: #eef4fb; --text-2: #a9bdd8; --text-3: #7488a8;
  --line: rgba(160,200,255,.10); --grid: rgba(160,200,255,.07);
  --glass: rgba(120,170,255,.05); --glass-2: rgba(130,180,255,.09); --glass-hi: rgba(200,235,255,.24);
  --chip: rgba(140,190,255,.08); --shadow: 0 18px 50px rgba(0,4,20,.5);
  --accent: #3fd6d0; --btn: linear-gradient(135deg, #14a9a5 0%, #1f7fd0 60%, #3560d8 100%);
  --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500; --s5: #d55181; --s6: #008300; --s7: #9085e9; --s8: #e66767;
  --ok: #3fbf78; --bad: #e66767; --warn: #c98500;
  --font: -apple-system, BlinkMacSystemFont, "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", "Segoe UI", sans-serif;
  --mono: ui-monospace, "SF Mono", "JetBrains Mono", "Cascadia Mono", Consolas, monospace;
}
@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) {
    color-scheme: light; --bg: #edf5fb; --bg-2: #d8e9f7; --text: #0a1a33; --text-2: #33496b; --text-3: #5d7190;
    --line: rgba(10,40,90,.11); --grid: rgba(10,40,90,.07); --glass: rgba(255,255,255,.58); --glass-2: rgba(255,255,255,.78); --glass-hi: rgba(255,255,255,.96);
    --chip: rgba(10,50,110,.06); --shadow: 0 16px 40px rgba(16,50,100,.13);
    --accent: #0a7f88; --btn: linear-gradient(135deg, #0c9c97 0%, #1574bf 60%, #2a4fbf 100%);
    --s1: #2a78d6; --s2: #eb6834; --s3: #1baf7a; --s4: #eda100; --s7: #4a3aa7; --s8: #e34948; --ok: #18864b; --bad: #cf222e; --warn: #9a6700;
  }
}
* { box-sizing: border-box; }
html { background: var(--bg); }
body { margin: 0; background: radial-gradient(1200px 700px at 20% -10%, var(--bg-2), var(--bg)); background-attachment: fixed; color: var(--text); font: 15px/1.6 var(--font); }
body::before { content: ""; position: fixed; inset: -20vmax; z-index: -1; background: radial-gradient(40vmax 40vmax at 10% 10%, rgba(27,63,166,.38), transparent 60%), radial-gradient(40vmax 40vmax at 90% 30%, rgba(15,163,168,.22), transparent 60%), radial-gradient(40vmax 40vmax at 50% 100%, rgba(42,95,216,.2), transparent 60%); filter: blur(30px); }
.glass { position: relative; background: linear-gradient(145deg, var(--glass-2), var(--glass) 60%); -webkit-backdrop-filter: blur(20px) saturate(160%); backdrop-filter: blur(20px) saturate(160%); border-radius: 20px; box-shadow: var(--shadow), inset 0 1px 0 var(--glass-hi); }
.wrap { max-width: 1240px; margin: 0 auto; padding: 0 20px; }
header { position: sticky; top: 10px; z-index: 10; padding: 0 10px; }
.nav { max-width: 1240px; margin: 0 auto; display: flex; align-items: center; gap: 8px; padding: 8px 10px 8px 18px; border-radius: 999px; overflow-x: auto; }
.nav b { white-space: nowrap; margin-right: 8px; }
.nav a { color: var(--text-2); text-decoration: none; padding: 6px 12px; border-radius: 999px; font-size: 14px; white-space: nowrap; }
.nav a:hover { background: var(--chip); color: var(--text); }
.seg { margin-left: auto; display: inline-flex; padding: 3px; border-radius: 999px; background: var(--chip); flex-shrink: 0; }
.seg button { border: 0; background: transparent; color: var(--text-2); padding: 5px 12px; border-radius: 999px; font: inherit; font-size: 13.5px; cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--btn); color: #fff; font-weight: 650; box-shadow: inset 0 1px 0 rgba(255,255,255,.3); }
.nav .logo { width: 24px; height: 24px; flex: none; }
footer { padding: 40px 0; color: var(--text-3); font-size: 13px; }
.about { padding: 20px; display: grid; grid-template-columns: 1fr auto; gap: 20px; align-items: start; }
@media (max-width: 640px) { .about { grid-template-columns: 1fr; } .about figure { justify-self: center; } }
.about h2 { margin: 0 0 4px; font-size: 18px; color: var(--text); display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 10px; }
.about .ver { font: 600 12.5px var(--mono); color: var(--accent); background: color-mix(in srgb, var(--accent) 13%, transparent); padding: 2px 9px; border-radius: 999px; }
.about dl { display: grid; grid-template-columns: auto 1fr; gap: 5px 14px; margin: 12px 0 0; font-size: 13.5px; }
.about dt { color: var(--text-3); white-space: nowrap; }
.about dd { margin: 0; color: var(--text); min-width: 0; overflow-wrap: anywhere; }
.about a { color: var(--accent); text-underline-offset: 3px; }
.about .gpl { margin: 14px 0 0; padding: 10px 12px; border-radius: 12px; background: var(--chip); color: var(--text-2); font-size: 13px; }
.about figure { margin: 0; text-align: center; font-size: 12px; }
.about figure img { display: block; width: 120px; height: 120px; margin: 0 auto 6px; padding: 6px; border-radius: 14px; background: #fff; }
.fine { text-align: center; margin-top: 18px; }
</style>
</head>
<body>
<header><div class="nav glass">
  <svg class="logo" viewBox="0 0 64 64" aria-hidden="true"><defs><linearGradient id="dSea" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#14306e"/><stop offset="1" stop-color="#071433"/></linearGradient><linearGradient id="dWave" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#22d3c5"/><stop offset="1" stop-color="#27b4ea"/></linearGradient></defs><rect width="64" height="64" rx="16" fill="url(#dSea)"/><path d="M12 24c7-6 13-6 20 0s13 6 20 0" fill="none" stroke="url(#dWave)" stroke-width="5" stroke-linecap="round"/><path d="M12 35c7-6 13-6 20 0s13 6 20 0" fill="none" stroke="url(#dWave)" stroke-width="5" stroke-linecap="round" opacity=".75"/><path d="M12 46c7-6 13-6 20 0s13 6 20 0" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" opacity=".9"/></svg>
  <b>黑潮 DNS · 詳細數據</b>
  <a href="#overview">總覽</a><a href="#upstreams">上游</a><a href="#routing">機會成本</a><a href="#pools">節點池</a><a href="#domains">CDN 網域</a><a href="#crosscdn">跨 CDN</a><a href="#top">排行</a><a href="#filter">過濾</a><a href="#jobs">工作</a><a href="#trace">追蹤</a><a href="#about">關於</a>
  <div class="seg" role="group" aria-label="期間"><button data-range="today" aria-pressed="true">今天</button><button data-range="7d" aria-pressed="false">7 天</button><button data-range="30d" aria-pressed="false">30 天</button></div>
</div></header>

<!-- 圖表與表格由共用儀表板（/assets/dashboard.js）畫出來 -->
<main class="wrap" id="dash"></main>
<footer id="about">
  <div class="wrap">
    <div class="about glass">
      <div>
        <h2><span id="abName">黑潮 DNS（Kuroshio DNS）</span><span class="ver" id="abVer">—</span></h2>
        <dl>
          <dt>核心</dt><dd id="abCore">—</dd>
          <dt>授權</dt><dd><a id="abLic" href="https://www.gnu.org/licenses/gpl-3.0.html" target="_blank" rel="noopener noreferrer">GPL-3.0-or-later</a></dd>
          <dt>原始碼</dt><dd><a id="abSrc" target="_blank" rel="noopener noreferrer">—</a></dd>
          <dt>功能</dt><dd id="abFeat">—</dd>
        </dl>
        <p class="gpl"><b>GPL-3.0 是什麼意思？</b>你可以自由使用、修改、分享這個程式；如果把修改過的版本散布給別人，就要用同樣的授權一併提供它的原始碼。</p>
      </div>
      <figure><img src="/qr.svg?for=source" alt="原始碼網址的 QR 碼" width="120" height="120"><figcaption>掃描開啟原始碼</figcaption></figure>
    </div>
    <div class="fine">黑潮 DNS · {{HOST}} · 此頁不公開、不被搜尋引擎收錄 · 請勿轉傳連結</div>
  </div>
</footer>

<script src="/assets/dashboard.js"></script>
<script>
(() => {
  const $ = s => document.querySelector(s), $$ = s => [...document.querySelectorAll(s)];
  // 共用儀表板：資料來自這一頁底下的唯讀 API（api/…，已經打過馬賽克）
  const dash = KuroshioDashboard.mount($('#dash'), {
    adapter: KuroshioDashboard.publicAdapter('api/'),
    sections: KuroshioDashboard.DETAIL_SECTIONS,
    domainsMode: 'client',
    showErrors: false,
    refreshMs: 15000
  });
  $$('.seg button').forEach(b => b.addEventListener('click', () => { $$('.seg button').forEach(x => x.setAttribute('aria-pressed', String(x === b))); dash.setRange(b.dataset.range); }));

  // 關於：版本、授權、原始碼（詳細頁的唯讀 API 沒有這項，改問公開頁的 /api/public/info；字串一律用 textContent）
  const FEAT = { doh: 'DoH', doh3: 'DoH3', dot: 'DoT', doq: 'DoQ', cdn: 'CDN 台灣節點', community: '好友社群', filter: '過濾', acme: '自動憑證', 'windows-service': 'Windows 服務' };
  const httpUrl = u => (typeof u === 'string' && /^https?:\/\//i.test(u)) ? u : null;
  async function loadAbout() {
    const a = (await fetch('/api/public/info').then(r => r.json())).about;
    if (!a || typeof a !== 'object') return;
    if (a.name) $('#abName').textContent = a.name;
    if (a.version) $('#abVer').textContent = 'v' + a.version;
    $('#abCore').textContent = [a.version && 'v' + a.version, a.language, a.target].filter(Boolean).join(' · ') || '—';
    if (a.license) $('#abLic').textContent = a.license;
    if (httpUrl(a.licenseUrl)) $('#abLic').href = httpUrl(a.licenseUrl);
    const su = httpUrl(a.source);
    if (su) { $('#abSrc').href = su; $('#abSrc').textContent = su; }
    if (Array.isArray(a.features) && a.features.length) $('#abFeat').textContent = a.features.map(f => FEAT[f] || String(f)).join('、');
  }
  loadAbout().catch(() => {});
})();
</script>
</body>
</html>
