name: Kuroshio DNS (Rust)

# 推送：測試 + 所有 CPU 的執行檔 + Windows + x86_64 的 OpenWrt 套件與實機測試
# v3.* 標籤或手動執行（full = true）：所有 CPU 的 OpenWrt 套件，標籤時建立 Release
on:
  push:
    branches: [ main, rust-3.0 ]
    tags: [ 'v3.*' ]
  pull_request:
  workflow_dispatch:
    inputs:
      full:
        description: 編譯所有 CPU 的 OpenWrt 套件
        type: boolean
        default: true

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: 測試
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: 格式
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Clippy（內建 ACME，Windows 版用）
        run: cargo clippy -p kuroshio --all-targets --features acme -- -D warnings
      - name: 單元與整合測試
        run: cargo test
      - name: Shell 腳本
        run: |
          shellcheck -s sh -e SC2034,SC2154,SC1008,SC3043,SC1091 openwrt/kuroshio/files/kuroshio.init
          shellcheck -s sh -e SC3043,SC1091 openwrt/kuroshio/files/takeover.sh openwrt/kuroshio/files/acme.sh openwrt/kuroshio/files/access.sh openwrt/kuroshio/files/rpcd.sh openwrt/kuroshio/files/lan.sh openwrt/kuroshio/files/guard.sh openwrt/kuroshio/files/kuroshio.uci-defaults
          shellcheck -s sh -e SC3043,SC2015,SC2086,SC1091 openwrt/tools/ci-smoke-kuroshio.sh openwrt/tools/ci-luci-setup.sh
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: LuCI 語法
        run: node openwrt/tools/check-luci.js luci-app-kuroshio
      # Windows 本機設定頁（data/admin）：debug 執行檔 + Playwright，腳本自己用暫存設定檔啟動 kuroshio
      - name: 編譯（設定頁測試用，debug）
        run: cargo build -p kuroshio
      - name: Playwright
        run: |
          npm i --no-save playwright@1.48.2
          # 系統套件伺服器偶爾連不到：重試三次，還是失敗就只裝瀏覽器本體（runner 本來就有 Chrome 需要的函式庫）
          for i in 1 2 3; do timeout 300 npx playwright install --with-deps chromium && break; echo "::warning::playwright --with-deps 第 $i 次失敗"; sleep 20; done || true
          npx playwright install chromium
      - name: 設定頁端對端測試
        run: node tools/admin-e2e.js
        env:
          KUROSHIO_BIN: target/debug/kuroshio
          SHOTS: screenshots-admin
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: admin-ui-screenshots
          path: screenshots-admin
          if-no-files-found: ignore

  binaries:
    name: 執行檔 ${{ matrix.target }}
    needs: test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-unknown-linux-musl,      qemu: '' }
          - { target: i686-unknown-linux-musl,        qemu: qemu-i386 }
          - { target: aarch64-unknown-linux-musl,     qemu: qemu-aarch64 }
          - { target: armv7-unknown-linux-musleabihf, qemu: qemu-arm }
          # MIPS 在 Rust 是 tier 3：用 nightly 自己編標準函式庫（OpenWrt 的 mips_24kc / mipsel_24kc 都是軟體浮點，跟這兩個 target 相同）
          - { target: mipsel-unknown-linux-musl,      qemu: qemu-mipsel, nightly: true }
          - { target: mips-unknown-linux-musl,        qemu: qemu-mips,   nightly: true }
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        if: ${{ !matrix.nightly }}
        with:
          targets: ${{ matrix.target }}
      - uses: dtolnay/rust-toolchain@nightly
        if: ${{ matrix.nightly }}
        with:
          components: rust-src
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: 安裝 zig 與 cargo-zigbuild
        run: pip install ziglang cargo-zigbuild
      - name: 編譯
        run: |
          if [ "${{ matrix.nightly }}" = "true" ]; then
            # MIPS 的 static-pie 執行檔一啟動就 segfault：改成非 PIE 的靜態執行檔
            export RUSTFLAGS="-C relocation-model=static"
            cargo zigbuild --release -p kuroshio --target ${{ matrix.target }} -Zbuild-std=std,panic_abort
          else
            cargo zigbuild --release -p kuroshio --target ${{ matrix.target }}
          fi
          ls -la target/${{ matrix.target }}/release/kuroshio
          file target/${{ matrix.target }}/release/kuroshio
      - name: 用 QEMU 實際執行
        run: |
          BIN=target/${{ matrix.target }}/release/kuroshio
          if [ -n "${{ matrix.qemu }}" ]; then
            # 新版 Ubuntu 沒有 qemu-user-static，改用 qemu-user（執行檔是靜態連結，兩種都能跑）
            # Ubuntu 套件伺服器偶爾解析不到：每次重新 update 再試，最多 5 次
            for i in 1 2 3 4 5; do
              sudo apt-get update -qq || true
              if sudo apt-get install -y -qq qemu-user-static >/dev/null 2>&1 || sudo apt-get install -y -qq --fix-missing qemu-user >/dev/null; then break; fi
              echo "::warning::安裝 QEMU 第 $i 次失敗，30 秒後重試"; sleep 30
            done
            Q=$(command -v "${{ matrix.qemu }}-static" || command -v "${{ matrix.qemu }}")
            RUN="$Q $BIN"
          else
            RUN="$BIN"
          fi
          $RUN --version
          $RUN defaults | head -c 200; echo
          $RUN query example.com -s 8.8.8.8
          # 加密上游（DoT / DoH，HTTP/2）：TLS 在各種 CPU 上都要能用
          $RUN query example.com -s tls://1.1.1.1
          $RUN query example.com -s tls://dns.google
          $RUN query example.com -s https://cloudflare-dns.com/dns-query
          $RUN query example.com -s https://dns.google/dns-query
          # QUIC：DoQ / DoH3
          $RUN query example.com -s quic://dns.adguard-dns.com
          $RUN query example.com -s h3://cloudflare-dns.com/dns-query || $RUN query example.com -s h3://dns.google/dns-query
          # 啟動伺服器，再用同一個執行檔查詢自己
          echo '{"listen":{"plain":{"binds":["127.0.0.1"],"port":5336}},"upstream":{"pinned":["udp://8.8.8.8","udp://1.1.1.1"]}}' > /tmp/k.json
          $RUN run -c /tmp/k.json & PID=$!
          # 等到真的在監聽（QEMU 模擬慢的架構啟動要比較久），最多 30 秒
          for i in $(seq 1 30); do $RUN query example.com -s 127.0.0.1:5336 >/dev/null 2>&1 && break; sleep 1; done
          $RUN query example.com -s 127.0.0.1:5336
          $RUN query example.com -s tcp://127.0.0.1:5336
          kill $PID
          # 真的下載預設的訂閱清單：載入後擋得到廣告網域，順便記錄記憶體
          echo '{"listen":{"plain":{"binds":["127.0.0.1"],"port":5337}},"admin":{"port":8056},"system":{"persistDir":"/tmp/kf/state"}}' > /tmp/kf.json
          $RUN run -c /tmp/kf.json > /tmp/kf.log 2>&1 & PID=$!
          for i in $(seq 1 180); do grep -q "訂閱清單已載入" /tmp/kf.log && break; sleep 1; done
          grep -E "清單|自訂規則" /tmp/kf.log
          $RUN query doubleclick.net -s 127.0.0.1:5337 | tee /tmp/q.txt
          grep -q "0.0.0.0" /tmp/q.txt
          curl -s http://127.0.0.1:8056/api/status | python3 -c "import json,sys;d=json.load(sys.stdin);f=d['filter'];print('清單', f['lists'], '條、自訂', f['custom'], '條、過濾器', f['memoryBytes']//1024, 'KB、常駐記憶體', d['system']['rssKB'], 'KB')"
          kill $PID
          # 沒有硬體等級了：舊設定檔的 profile 照樣讀得進來（忽略），顯示動態的記憶體保留量與依核心數換算的設定
          echo '{"system":{"profile":"tiny"}}' > /tmp/tiny.json
          $RUN sysinfo -c /tmp/tiny.json | tee /tmp/sysinfo.txt
          grep -q '記憶體保留量' /tmp/sysinfo.txt
          grep -q '依 CPU 核心數換算的設定' /tmp/sysinfo.txt
      - uses: actions/upload-artifact@v4
        with:
          name: bin-${{ matrix.target }}
          path: target/${{ matrix.target }}/release/kuroshio

  windows:
    name: Windows
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: 測試
        run: cargo test --workspace --features kuroshio/acme
      - name: 編譯（含內建 ACME）
        run: cargo build --release -p kuroshio --features acme
      - name: 實際執行
        shell: pwsh
        run: |
          ./target/release/kuroshio.exe --version
          ./target/release/kuroshio.exe query example.com -s 8.8.8.8
          ./target/release/kuroshio.exe query example.com -s tls://1.1.1.1
          if ($LASTEXITCODE -ne 0) { exit 1 }
          ./target/release/kuroshio.exe query example.com -s https://dns.google/dns-query
          if ($LASTEXITCODE -ne 0) { exit 1 }
          ./target/release/kuroshio.exe query example.com -s quic://dns.adguard-dns.com
          if ($LASTEXITCODE -ne 0) { exit 1 }
          '{"listen":{"plain":{"binds":["127.0.0.1"],"port":5336}},"upstream":{"pinned":["udp://8.8.8.8","udp://1.1.1.1"]}}' | Set-Content -Encoding utf8 k.json
          $p = Start-Process -PassThru -NoNewWindow ./target/release/kuroshio.exe -ArgumentList 'run','-c','k.json'
          Start-Sleep 3
          ./target/release/kuroshio.exe query example.com -s 127.0.0.1:5336
          if ($LASTEXITCODE -ne 0) { exit 1 }
          Stop-Process $p
      - name: Windows 服務、防火牆、設定頁登入
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = (Resolve-Path ./target/release/kuroshio.exe).Path
          $dir = Join-Path $env:RUNNER_TEMP 'ks'
          New-Item -ItemType Directory $dir | Out-Null
          $cfg = @{
            listen = @{ plain = @{ binds = @('127.0.0.1'); port = 5337 } }
            upstream = @{ pinned = @('udp://8.8.8.8', 'udp://1.1.1.1') }
            admin = @{ port = 18054; auth = $true }
            system = @{ persistDir = (Join-Path $dir 'state') }
          } | ConvertTo-Json -Depth 5
          Set-Content -Encoding utf8 -Path (Join-Path $dir 'config.json') -Value $cfg
          $c = Join-Path $dir 'config.json'
          & $exe setup -c $c
          if ($LASTEXITCODE -ne 0) { throw 'setup 失敗' }
          netsh advfirewall firewall show rule name=all | Select-String '黑潮 DNS'
          & $exe service install -c $c
          if ($LASTEXITCODE -ne 0) { throw 'service install 失敗' }
          & $exe service start
          Start-Sleep 6
          $st = & $exe service status
          Write-Host "狀態：$st"
          if ("$st" -notmatch 'Running') { Get-Content (Join-Path $dir 'kuroshio*.log') -ErrorAction SilentlyContinue; throw '服務沒有在執行' }
          & $exe query example.com -s 127.0.0.1:5337
          if ($LASTEXITCODE -ne 0) { throw '服務的 DNS 查詢失敗' }
          # 設定頁：沒登入 401、用 token 登入後可以讀狀態與設定
          $r = Invoke-WebRequest http://127.0.0.1:18054/api/status -SkipHttpErrorCheck
          if ($r.StatusCode -ne 401) { throw "沒登入應該是 401，實際 $($r.StatusCode)" }
          $tok = (Get-Content (Join-Path $dir 'admin.token')).Trim()
          # 登入會 303 轉回首頁（MaximumRedirection 0 在 PowerShell 7 會直接丟例外）：照常跟著轉，再用 cookie 讀狀態確認
          $null = Invoke-WebRequest "http://127.0.0.1:18054/login?token=$tok" -SessionVariable s -SkipHttpErrorCheck
          $status = Invoke-RestMethod http://127.0.0.1:18054/api/status -WebSession $s
          Write-Host "版本 $($status.version)，等級 $($status.system.tier)"
          $conf = Invoke-RestMethod http://127.0.0.1:18054/api/config -WebSession $s
          if ($conf.user.listen.plain.port -ne 5337) { throw '讀不到設定檔' }
          $sess = Invoke-RestMethod http://127.0.0.1:18054/api/session -WebSession $s
          if ($sess.mode -ne 'service') { throw "執行方式應該是 service，實際 $($sess.mode)" }
          & $exe service stop
          Start-Sleep 5
          $st = & $exe service status
          if ("$st" -notmatch 'Stopped') { throw "停止後狀態 $st" }
          $log = Get-Content (Join-Path $dir 'kuroshio.log') -Raw
          Write-Host $log
          if ($log -notmatch '結束') { throw '服務停止時沒有正常收尾' }
          & $exe service uninstall
          if ($LASTEXITCODE -ne 0) { throw 'service uninstall 失敗' }
      - name: IIS 憑證匯入與綁定
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $appcmd = "$env:windir\System32\inetsrv\appcmd.exe"
          if (!(Test-Path $appcmd)) { Write-Host "::warning::這台 runner 沒有 IIS，略過 IIS 憑證測試"; exit 0 }
          $exe = (Resolve-Path ./target/release/kuroshio.exe).Path
          $dir = Join-Path $env:RUNNER_TEMP 'iis'
          New-Item -ItemType Directory $dir | Out-Null
          # 測試憑證（EC P-256，網域 localhost）
          & 'C:\Program Files\Git\usr\bin\openssl.exe' req -x509 -newkey ec -pkeyopt ec_paramgen_curve:P-256 -nodes -days 2 -subj /CN=localhost -addext 'subjectAltName=DNS:localhost' -addext 'basicConstraints=critical,CA:FALSE' -keyout "$dir\key.pem" -out "$dir\cert.pem"
          $cfg = @{ domain = 'localhost'; tls = @{ cert = "$dir\cert.pem"; key = "$dir\key.pem" }; system = @{ persistDir = "$dir\state" } } | ConvertTo-Json -Depth 5
          Set-Content -Encoding utf8 -Path "$dir\config.json" -Value $cfg
          & $exe iis cert 'Default Web Site' -c "$dir\config.json"
          if ($LASTEXITCODE -ne 0) { throw 'iis cert 失敗' }
          $thumb = (Get-Content "$dir\state\iis-cert.json" | ConvertFrom-Json).thumbprint
          if (!(Test-Path "Cert:\LocalMachine\My\$thumb")) { throw "憑證存放區裡沒有 $thumb" }
          $show = (netsh http show sslcert hostnameport=localhost:443 | Out-String) -replace ' ', ''
          if ($show -notmatch $thumb) { Write-Host $show; throw 'netsh 的綁定不是這張憑證' }
          $b = & $appcmd list site 'Default Web Site' /text:bindings
          if ("$b" -notmatch 'https/\*:443:localhost') { throw "IIS 站台沒有 HTTPS 繫結：$b" }
          # 再跑一次：已經是最新，不重複匯入
          $again = & $exe iis cert 'Default Web Site' -c "$dir\config.json"
          if ("$again" -notmatch '已經是最新') { throw "第二次應該是已經是最新：$again" }
          # IIS 真的用這張憑證回應
          Start-Service W3SVC
          & $appcmd start site 'Default Web Site' | Out-Null
          Start-Sleep 2
          $tcp = [System.Net.Sockets.TcpClient]::new('127.0.0.1', 443)
          $ssl = [System.Net.Security.SslStream]::new($tcp.GetStream(), $false, { $true })
          $ssl.AuthenticateAsClient('localhost')
          $served = ([System.Security.Cryptography.X509Certificates.X509Certificate2]$ssl.RemoteCertificate).Thumbprint
          $ssl.Dispose(); $tcp.Dispose()
          if ($served -ne $thumb) { throw "IIS 回應的憑證是 $served，不是 $thumb" }
          Write-Host "IIS 用 $thumb 回應 https://localhost"
      - name: HTTP.sys 共用（模式 B）
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $appcmd = "$env:windir\System32\inetsrv\appcmd.exe"
          if (!(Test-Path $appcmd)) { Write-Host "::warning::這台 runner 沒有 IIS，略過 HTTP.sys 共用測試"; exit 0 }
          $exe = (Resolve-Path ./target/release/kuroshio.exe).Path
          $dir = Join-Path $env:RUNNER_TEMP 'httpsys'
          New-Item -ItemType Directory $dir | Out-Null
          # IIS 要在執行、而且有 localhost:443 的 HTTPS 繫結（上一步建立的），這樣才是真的跟 IIS 共用 443
          Start-Service W3SVC
          $b = & $appcmd list site 'Default Web Site' /text:bindings
          if ("$b" -notmatch 'https/\*:443:localhost') {
            & $appcmd set site /site.name:'Default Web Site' "/+bindings.[protocol='https',bindingInformation='*:443:localhost',sslFlags='1']" | Out-Null
          }
          & $appcmd start site 'Default Web Site' | Out-Null
          # 另一張測試憑證（跟 IIS 那一步不同），確認綁定換成黑潮 DNS 的
          & 'C:\Program Files\Git\usr\bin\openssl.exe' req -x509 -newkey ec -pkeyopt ec_paramgen_curve:P-256 -nodes -days 2 -subj /CN=localhost -addext 'subjectAltName=DNS:localhost' -addext 'basicConstraints=critical,CA:FALSE' -keyout "$dir\key.pem" -out "$dir\cert.pem"
          $want = [System.Security.Cryptography.X509Certificates.X509Certificate2]::CreateFromPemFile("$dir\cert.pem", "$dir\key.pem").Thumbprint
          $cfg = @{
            domain = 'localhost'
            tls = @{ cert = "$dir\cert.pem"; key = "$dir\key.pem" }
            listen = @{ plain = @{ binds = @('127.0.0.1'); port = 5338 }; doh = @{ enabled = $true; windowsMode = 'httpsys'; host = '0.0.0.0'; port = 443 } }
            upstream = @{ pinned = @('udp://8.8.8.8', 'udp://1.1.1.1') }
            admin = @{ port = 18055; auth = $false }
            system = @{ persistDir = "$dir\state" }
          } | ConvertTo-Json -Depth 6
          Set-Content -Encoding utf8 -Path "$dir\config.json" -Value $cfg
          $p = Start-Process -PassThru -NoNewWindow $exe -ArgumentList 'run','-c',"$dir\config.json" -RedirectStandardOutput "$dir\out.log" -RedirectStandardError "$dir\err.log"
          function Show-Log { Get-Content "$dir\out.log", "$dir\err.log" -ErrorAction SilentlyContinue | Write-Host }
          function Get-Status { Invoke-RestMethod http://127.0.0.1:18055/api/status }
          try {
            # 等到網址登記好、憑證綁上（自動同步啟動時就跑一次）
            $st = $null
            for ($i = 0; $i -lt 60; $i++) {
              Start-Sleep 1
              try { $st = Get-Status } catch { continue }
              if ($st.dohMode.mode -eq 'httpsys' -and (Test-Path "$dir\state\httpsys-cert.json")) { break }
            }
            if ($st.dohMode.mode -ne 'httpsys') { Show-Log; throw "模式應該是 httpsys，實際 $($st.dohMode | ConvertTo-Json -Depth 5)" }
            Write-Host ($st.dohMode | ConvertTo-Json -Depth 5)
            Write-Host ($st.doh3Provider | ConvertTo-Json)
            if (@($st.dohMode.urls | Where-Object { -not $_.ok }).Count -gt 0) { Show-Log; throw '有網址沒登記成功' }
            $d = @($st.listenersDetail | Where-Object { $_.proto -eq 'doh' -and $_.bind -eq 'httpsys' })
            if ($d.Count -ne 1 -or -not $d[0].ok) { throw "listenersDetail 沒有 doh / httpsys：$($st.listenersDetail | ConvertTo-Json)" }
            $reg = netsh http show servicestate view=requestq | Out-String
            if ($reg -notmatch '(?i)https://localhost:443/dns-query/') { Write-Host $reg; throw 'HTTP.sys 沒有 /dns-query/ 的登記' }
            # 憑證：存放區、netsh 綁定、實際 TLS 回應都是這一張
            $thumb = (Get-Content "$dir\state\httpsys-cert.json" | ConvertFrom-Json).thumbprint
            if ($thumb -ne $want) { throw "綁定紀錄是 $thumb，不是 $want" }
            if (!(Test-Path "Cert:\LocalMachine\My\$thumb")) { throw "憑證存放區裡沒有 $thumb" }
            $show = (netsh http show sslcert hostnameport=localhost:443 | Out-String) -replace ' ', ''
            if ($show -notmatch $thumb) { Write-Host $show; throw 'netsh 的綁定不是這張憑證' }
            $tcp = [System.Net.Sockets.TcpClient]::new('127.0.0.1', 443)
            $ssl = [System.Net.Security.SslStream]::new($tcp.GetStream(), $false, { $true })
            $ssl.AuthenticateAsClient('localhost')
            $served = ([System.Security.Cryptography.X509Certificates.X509Certificate2]$ssl.RemoteCertificate).Thumbprint
            $ssl.Dispose(); $tcp.Dispose()
            if ($served -ne $thumb) { throw "HTTP.sys 回應的憑證是 $served，不是 $thumb" }
            # 真的 DoH 查詢（example.com A，RFC 8484 GET 與 POST）
            $b64 = 'AAABAAABAAAAAAAAB2V4YW1wbGUDY29tAAABAAE'
            [IO.File]::WriteAllBytes("$dir\q.bin", [Convert]::FromBase64String('AAABAAABAAAAAAAAB2V4YW1wbGUDY29tAAABAAE='))
            function Test-Dns($file, $meta, $what) {
              if ($meta -notmatch '^200 application/dns-message') { Show-Log; throw "$what：$meta" }
              $r = [IO.File]::ReadAllBytes($file)
              if ($r.Length -lt 12) { throw "$what：回應太短（$($r.Length) bytes）" }
              if (($r[2] -band 0x80) -eq 0) { throw "$what：不是 DNS 回應" }
              if (($r[3] -band 0x0f) -ne 0) { throw "$what：RCODE $($r[3] -band 0x0f)" }
              if (($r[6] * 256 + $r[7]) -lt 1) { throw "$what：沒有答案" }
              Write-Host "$what：$meta，$($r.Length) bytes，$($r[6] * 256 + $r[7]) 筆答案"
            }
            $m = curl.exe -sk --http1.1 -o "$dir\r1.bin" -w '%{http_code} %{content_type}' "https://localhost/dns-query?dns=$b64"
            Test-Dns "$dir\r1.bin" $m 'DoH GET（HTTP/1.1）'
            $m = curl.exe -sk -o "$dir\r2.bin" -w '%{http_code} %{content_type}' "https://localhost/dns-query?dns=$b64"
            Test-Dns "$dir\r2.bin" $m 'DoH GET（curl 預設）'
            $m = curl.exe -sk -o "$dir\r3.bin" -w '%{http_code} %{content_type}' -H 'content-type: application/dns-message' --data-binary "@$dir\q.bin" 'https://localhost/dns-query'
            Test-Dns "$dir\r3.bin" $m 'DoH POST'
            # IIS 自己的站台照常回應 /（不是黑潮 DNS 回的）
            $h = curl.exe -sk -o NUL -D - 'https://localhost/' | Out-String
            Write-Host $h
            if ($h -notmatch 'HTTP/[0-9.]+ 200' -or $h -notmatch '(?i)server: Microsoft-IIS') { throw 'IIS 的 / 沒有照常回應' }
            # 重新載入（設定頁存檔）：舊的登記移除、新的一輪重新登記，查詢照常
            $u = (Invoke-RestMethod http://127.0.0.1:18055/api/config).user
            $null = Invoke-RestMethod -Method Put http://127.0.0.1:18055/api/config -ContentType 'application/json' -Body ($u | ConvertTo-Json -Depth 20)
            $ok = $false
            for ($i = 0; $i -lt 30; $i++) {
              Start-Sleep 1
              $m = curl.exe -sk -o "$dir\r4.bin" -w '%{http_code} %{content_type}' "https://localhost/dns-query?dns=$b64"
              if ($m -match '^200 application/dns-message') { $ok = $true; break }
            }
            if (-not $ok) { Show-Log; throw "重新載入後查詢失敗：$m" }
            Test-Dns "$dir\r4.bin" $m '重新載入後 DoH GET'
          } finally {
            Stop-Process $p -ErrorAction SilentlyContinue
            Start-Sleep 2
          }
          Show-Log
          # 結束後 HTTP.sys 不再有黑潮 DNS 的網址
          $reg = netsh http show servicestate view=requestq | Out-String
          if ($reg -match '(?i)https://localhost:443/dns-query/') { Write-Host $reg; throw '結束後 /dns-query/ 還登記在 HTTP.sys' }
          $m = curl.exe -sk -o NUL -w '%{http_code}' "https://localhost/dns-query?dns=$b64"
          if ($m -eq '200') { throw '結束後 /dns-query 還有回應' }
          Write-Host "結束後 /dns-query 由 IIS 回 $m，登記已移除"
      - name: 打包
        shell: pwsh
        run: |
          New-Item -ItemType Directory dist/kuroshio | Out-Null
          Copy-Item target/release/kuroshio.exe, LICENSE, windows/README.txt dist/kuroshio/
          # 唯讀資料（種子、評測名單、CDN 範圍、設定頁、公開頁）：執行檔旁的 data\ 會自動使用
          Copy-Item -Recurse data dist/kuroshio/data
          Copy-Item rules/default-custom-rules.txt dist/kuroshio/data/
          Compress-Archive dist/kuroshio dist/kuroshio-windows-x86_64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: kuroshio-windows-x86_64
          path: dist/kuroshio-windows-x86_64.zip

  plan:
    name: 套件清單
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.m.outputs.matrix }}
    steps:
      - id: m
        run: |
          # sdk = OpenWrt SDK 的架構名稱；arch = OpenWrt 編譯時的 $(ARCH)；target = Rust 執行檔
          ALL='[
            {"sdk":"x86_64","arch":"x86_64","target":"x86_64-unknown-linux-musl"},
            {"sdk":"i386_pentium4","arch":"i386","target":"i686-unknown-linux-musl"},
            {"sdk":"aarch64_generic","arch":"aarch64","target":"aarch64-unknown-linux-musl"},
            {"sdk":"aarch64_cortex-a53","arch":"aarch64","target":"aarch64-unknown-linux-musl"},
            {"sdk":"aarch64_cortex-a72","arch":"aarch64","target":"aarch64-unknown-linux-musl"},
            {"sdk":"arm_cortex-a7_neon-vfpv4","arch":"arm","target":"armv7-unknown-linux-musleabihf"},
            {"sdk":"arm_cortex-a9_vfpv3-d16","arch":"arm","target":"armv7-unknown-linux-musleabihf"},
            {"sdk":"arm_cortex-a15_neon-vfpv4","arch":"arm","target":"armv7-unknown-linux-musleabihf"},
            {"sdk":"mipsel_24kc","arch":"mipsel","target":"mipsel-unknown-linux-musl"},
            {"sdk":"mips_24kc","arch":"mips","target":"mips-unknown-linux-musl"}
          ]'
          if [ "${{ startsWith(github.ref, 'refs/tags/v3.') }}" = "true" ] || [ "${{ inputs.full }}" = "true" ]; then
            ARCHS="$ALL"
          else
            ARCHS=$(echo "$ALL" | jq -c '[.[] | select(.sdk == "x86_64")]')
          fi
          echo "matrix=$(echo "$ARCHS" | jq -c '[.[] as $a | ("24.10","25.12") as $r | $a + {release: $r, format: (if $r == "24.10" then "ipk" else "apk" end)}]')" >> "$GITHUB_OUTPUT"

  openwrt:
    name: OpenWrt ${{ matrix.release }} ${{ matrix.sdk }}
    needs: [ binaries, plan ]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: bin-${{ matrix.target }}
          path: prebuilt/${{ matrix.arch }}
      - run: chmod +x prebuilt/${{ matrix.arch }}/kuroshio
      - name: OpenWrt SDK 打包
        uses: openwrt/gh-action-sdk@main
        env:
          ARCH: ${{ matrix.sdk }}-openwrt-${{ matrix.release }}
          FEEDNAME: kuroshio
          PACKAGES: kuroshio luci-app-kuroshio
          NO_DEFAULT_FEEDS: 1
          NO_REFRESH_CHECK: 1
          NO_SHFMT_CHECK: 1
          V: s
      - name: 整理套件
        run: |
          mkdir -p dist
          find bin/packages \( -name "kuroshio*.${{ matrix.format }}" -o -name "luci-app-kuroshio*.${{ matrix.format }}" \) -exec cp {} dist/ \;
          ls -la dist
          test -n "$(ls dist)"
      - uses: actions/upload-artifact@v4
        with:
          name: kuroshio-openwrt-${{ matrix.release }}-${{ matrix.sdk }}
          path: dist/*

  smoke:
    name: OpenWrt 實機測試 ${{ matrix.release }}
    needs: openwrt
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        release: [ '24.10', '25.12' ]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: kuroshio-openwrt-${{ matrix.release }}-x86_64
          path: pkgs
      - name: 測試憑證（rustls 需要 SAN，而且不能是 CA 憑證）
        run: openssl req -x509 -newkey ec -pkeyopt ec_paramgen_curve:P-256 -nodes -days 2 -subj /CN=localhost -addext "subjectAltName=IP:127.0.0.1,DNS:localhost" -addext "basicConstraints=critical,CA:FALSE" -keyout pkgs/test-key.pem -out pkgs/test-cert.pem
      - name: 安裝、DNS 接管、啟動、各協議查詢
        run: docker run --rm -v "$PWD:/src" -v "$PWD/pkgs:/pkgs" openwrt/rootfs:x86_64-openwrt-${{ matrix.release }} /bin/sh /src/openwrt/tools/ci-smoke-kuroshio.sh

  luci:
    name: LuCI 介面測試 ${{ matrix.release }}
    needs: openwrt
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        release: [ '24.10', '25.12' ]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: kuroshio-openwrt-${{ matrix.release }}-x86_64
          path: pkgs
      - name: 啟動 OpenWrt + LuCI
        run: |
          docker run -d --name owrt -p 8080:80 -v "$PWD:/src" -v "$PWD/pkgs:/pkgs" openwrt/rootfs:x86_64-openwrt-${{ matrix.release }} /bin/sh -c 'sleep infinity'
          docker exec owrt /bin/sh /src/openwrt/tools/ci-luci-setup.sh kuroshio
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Playwright
        run: |
          npm i --no-save playwright@1.48.2
          # 系統套件伺服器偶爾連不到：重試三次，還是失敗就只裝瀏覽器本體（runner 本來就有 Chrome 需要的函式庫）
          for i in 1 2 3; do timeout 300 npx playwright install --with-deps chromium && break; echo "::warning::playwright --with-deps 第 $i 次失敗"; sleep 20; done || true
          npx playwright install chromium
      - name: 打開每一頁（簡易 / 專業）、儲存
        run: node openwrt/tools/luci-e2e.js kuroshio
        env:
          SHOTS: screenshots-kuroshio-${{ matrix.release }}
      - name: uhttpd 紀錄
        if: always()
        run: docker exec owrt cat /tmp/uhttpd.log || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: luci-kuroshio-screenshots-${{ matrix.release }}
          path: screenshots-kuroshio-${{ matrix.release }}

  release:
    name: 發布
    if: startsWith(github.ref, 'refs/tags/v3.')
    needs: [ smoke, luci, windows ]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: art
      - name: 整理
        run: |
          mkdir -p dist
          find art -path '*kuroshio-openwrt-*' -type f -exec cp {} dist/ \;
          cp art/kuroshio-windows-x86_64/*.zip dist/
          for d in art/bin-*; do t=${d#art/bin-}; cp "$d/kuroshio" "dist/kuroshio-$t"; done
          ( cd dist && sha256sum * > SHA256SUMS )
          ls -la dist
      - uses: softprops/action-gh-release@v2
        with:
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: dist/*
